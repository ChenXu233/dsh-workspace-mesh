# Static workspace -> node assignment (SPEC §5.4).
# Workspaces missing here are "ungrouped" and left to the optional scheduler sub-plugin.
nodes:
  local-win:  { label: 本机,   endpoint: wss://100.x.x.1:7700 }
  shanghai:   { label: 上海,   endpoint: wss://100.x.x.2:7700 }
  tencent:    { label: 腾讯云, endpoint: wss://100.x.x.3:7700 }

assignments:
  # cwd = 对端机器上该工作区的目录; 跨机 dispatch 时远端 session 拥有它.
  - { workspaceId: ws-blog,   nodeId: shanghai,  cwd: /data/workspace/blog  }
  - { workspaceId: ws-newapi, nodeId: shanghai,  cwd: /data/workspace/newapi }
  - { workspaceId: ws-lobe,   nodeId: tencent,   cwd: /data/workspace/lobe   }
  - { workspaceId: ws-dev,    nodeId: local-win }

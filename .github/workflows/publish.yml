name: Publish

# Publishes to npm through a Trusted Publisher (OIDC) — no NPM_TOKEN secret.
# One-time setup on npmjs.com (package → Settings → Trusted publishing):
#   Publisher: GitHub Actions
#   Organization or user: ChenXu233
#   Repository: dsh-workspace-mesh
#   Workflow filename: publish.yml
#   Environment: (leave empty)
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build the tarball without uploading it to npm
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # build + typecheck + tests; see package.json
      - name: Verify
        run: pnpm verify

  publish:
    name: Publish to npm (trusted publishing)
    needs: verify
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Upgrade npm (OIDC trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@latest
      - name: Check that the git tag matches package.json
        if: github.ref_type == 'tag'
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${GITHUB_REF_NAME#v}
          echo "package.json=$PKG_VERSION tag=$TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag $TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi
      # Idempotent: re-pointing an existing release tag at a rewritten history
      # must not fail the run just because that version is already on npm.
      - name: Check whether this version is already on npm
        id: published
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "dsh-workspace-mesh@$VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::dsh-workspace-mesh@$VERSION is already on npm - skipping publish"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Inspect the publishable tarball
        run: npm pack --dry-run
      - name: Publish
        if: ${{ steps.published.outputs.exists == 'false' && !(github.event_name == 'workflow_dispatch' && inputs['dry-run']) }}
        run: npm publish --provenance --access public
      - name: Dry run (no upload)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs['dry-run'] }}
        run: npm publish --provenance --access public --dry-run

  release:
    name: GitHub release
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: dsh-workspace-mesh ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
